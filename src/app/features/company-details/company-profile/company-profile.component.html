<section class="company-profile__section" aria-labelledby="company-about-title">
  <h2 id="company-about-title" class="company-profile__title">About</h2>
  <p class="company-profile__about">{{ company().description || 'No description provided.' }}</p>
</section>

<section class="company-profile__section" aria-labelledby="company-contact-title">
  <h2 id="company-contact-title" class="company-profile__title">Contact</h2>
  <dl class="company-profile__contacts">
    <div class="company-profile__contact">
      <dt>
        <mat-icon class="company-profile__contact-icon" aria-hidden="true">location_on</mat-icon>
        Address
      </dt>
      <dd>{{ company().address || '—' }}</dd>
    </div>
    <div class="company-profile__contact">
      <dt>
        <mat-icon class="company-profile__contact-icon" aria-hidden="true">call</mat-icon>
        Phone
      </dt>
      <dd>{{ company().contact_number || '—' }}</dd>
    </div>
    <div class="company-profile__contact">
      <dt>
        <mat-icon class="company-profile__contact-icon" aria-hidden="true">mail</mat-icon>
        Email
      </dt>
      <dd>
        @if (emailParts(); as parts) {
          <!-- Prefer wrapping right after the "@" for long addresses. -->
          {{ parts.local }}<wbr />{{ parts.domain }}
        } @else {
          —
        }
      </dd>
    </div>
  </dl>
</section>
