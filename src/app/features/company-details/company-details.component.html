<mat-drawer-container class="company-details" autosize [hasBackdrop]="false">
  <mat-drawer #jobDrawer class="company-details__drawer" position="end" mode="over">
    <div class="company-details__drawer-head">
      <h2 class="company-details__drawer-title">Job details</h2>
      <button
        mat-icon-button
        type="button"
        aria-label="Close job details"
        (click)="jobDrawer.close()"
      >
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <div class="company-details__drawer-body">
      @if (selectedJob(); as job) {
        <app-company-job-details [job]="job" />
      }
    </div>
  </mat-drawer>

  <mat-drawer-content class="company-details__content">
    <div class="company-details__back">
      <a
        matIconButton
        class="company-details__back-btn"
        [routerLink]="routes.companies"
        aria-label="Back to companies"
      >
        <mat-icon>arrow_back</mat-icon>
      </a>
      <span class="company-details__back-title">Back to companies</span>
    </div>

    @if (store.loading() && !store.company()) {
      <div class="company-details__status" role="status">
        <mat-progress-spinner mode="indeterminate" diameter="40" aria-hidden="true" />
        <p>Loading company...</p>
      </div>
    } @else if (store.company(); as company) {
      <div class="company-details__layout">
        <app-company-profile
          [company]="company"
          [canDelete]="canDelete()"
          (edit)="onEdit($event)"
          (delete)="onDelete($event)"
        />
        <mat-tab-group
          class="company-details__tabs"
          mat-stretch-tabs="false"
          animationDuration="0ms"
        >
          <mat-tab>
            <ng-template mat-tab-label>
              Job listings
              <span class="company-details__tab-count">{{ store.jobs().length }}</span>
            </ng-template>
            <app-company-jobs
              [company]="company"
              [canDelete]="canDelete()"
              (viewJob)="onViewJob($event); jobDrawer.open()"
            />
          </mat-tab>
          <mat-tab>
            <ng-template mat-tab-label>
              Applicants
              <span class="company-details__tab-count">{{ store.applicants().length }}</span>
            </ng-template>
            <app-company-applicants [company]="company" />
          </mat-tab>
        </mat-tab-group>
      </div>
    }
  </mat-drawer-content>
</mat-drawer-container>
