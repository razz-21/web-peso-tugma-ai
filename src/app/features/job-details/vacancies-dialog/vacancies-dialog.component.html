<h2 mat-dialog-title class="vacancies-dialog__title">
  <mat-icon aria-hidden="true">groups</mat-icon>
  Edit vacancies
</h2>

<form (submit)="save($event)">
  <mat-dialog-content>
    <p class="vacancies-dialog__subtitle">{{ data.job.title }}</p>

    <mat-form-field appearance="outline" class="vacancies-dialog__field">
      <mat-label>No. of vacancies</mat-label>
      <input
        matInput
        type="number"
        inputmode="numeric"
        autocomplete="off"
        [formField]="vacanciesForm.no_of_vacancies"
      />
      @if (vacanciesError(); as msg) {
        <mat-error>{{ msg }}</mat-error>
      } @else {
        <mat-hint>Number of open positions for this job</mat-hint>
      }
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button matButton="tonal" type="button" (click)="cancel()" [disabled]="saving()">Cancel</button>
    <button mat-flat-button type="submit" [disabled]="saving()">
      <div class="vacancies-dialog__save-button-content">
        @if (saving()) {
          <mat-progress-spinner mode="indeterminate" diameter="18" aria-hidden="true" />
          Saving...
        } @else {
          Save vacancies
        }
      </div>
    </button>
  </mat-dialog-actions>
</form>
